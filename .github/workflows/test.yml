name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with Ruff
        run: ruff check website/ tests/

      - name: Run unit + integration tests
        env:
          SECRET_KEY: ci-test-key
        run: pytest tests/ -q --ignore=tests/e2e --tb=short

      # E2E tests require a browser — run separately if needed
      # - name: Install Playwright
      #   run: pip install pytest-playwright && playwright install chromium
      # - name: Run E2E tests
      #   env:
      #     SECRET_KEY: ci-test-key
      #   run: pytest tests/e2e/ -v
